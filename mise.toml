[tools]
node = "lts"

[env]
# Dev defaults; the droplet overrides these in a gitignored mise.local.toml
# (mise merges it over this file) or via the systemd unit's Environment= lines.
# 7469 spells PINZ on a phone keypad
PORT = "7469"
# Production server, used by the server:* tasks
PINZ_SERVER = "noah@the-ark"
HOST = "127.0.0.1"
DATA_DIR = "{{config_root}}/data"

[tasks.setup]
description = "Install dependencies"
run = "npm install"

[tasks.start]
description = "Run the server (http://localhost:7469)"
run = "node server.js"

[tasks.stop]
description = "Kill whatever holds the dev port (strays from earlier runs)"
# Killing by PORT OWNER, never by name — same rationale as throughglass:
# it catches orphaned shells and can't reach anything that isn't in the way.
run = '''
if pids=$(lsof -nP -tiTCP:"$PORT" -sTCP:LISTEN 2>/dev/null) && [ -n "$pids" ]; then
  ps -o pid=,etime=,command= -p $pids 2>/dev/null | cut -c1-140 || true
  kill $pids 2>/dev/null || true
  echo "port $PORT cleared"
else
  echo "nothing on $PORT — already clear"
fi
'''

[tasks.admin]
description = 'Run the admin CLI: mise run admin -- user add <name>'
run = "node bin/pinz-admin.js"

# Convention: bare task names act locally; server:* tasks touch production.

[tasks."server:image"]
description = 'Upload a pinz picture to prod: mise run server:image -- <user> <file> ["50% 20%"] (any order)'
# Args are told apart by shape: an existing path is the file, something with a
# "%" is the crop position, anything else is the username. User and file are
# both mandatory.
# mise appends task args to the LAST line of the script, so the body lives in
# a function and the final line receives them as real "$@".
run = '''
upload() {
  user=""; file=""; pos=""
  for a in "$@"; do
    if [ -f "$a" ]; then file="$a"
    elif [ -z "${a##*%*}" ]; then pos="$a"
    else user="$a"; fi
  done
  if [ -z "$file" ] || [ -z "$user" ]; then
    echo 'usage: mise run server:image -- <user> <file> ["x% y%"]'; exit 1
  fi
  ext="${file##*.}"
  scp "$file" "$PINZ_SERVER:/tmp/pinz-upload.$ext"
  ssh "$PINZ_SERVER" "cd pinz && /usr/bin/mise exec -- node bin/pinz-admin.js image set $user /tmp/pinz-upload.$ext; rc=\$?; rm -f /tmp/pinz-upload.$ext; exit \$rc"
  if [ -n "$pos" ]; then
    ssh "$PINZ_SERVER" "cd pinz && /usr/bin/mise exec -- node bin/pinz-admin.js image position $user '$pos'"
  fi
  echo "done — refresh https://pinz.charleslobo.com"
}
upload'''

[tasks."server:image:position"]
description = 'Adjust a prod picture crop: mise run server:image:position -- <user> "50% 20%"'
run = '''
setpos() {
  user=""; pos=""
  for a in "$@"; do
    if [ -z "${a##*%*}" ]; then pos="$a"; else user="$a"; fi
  done
  if [ -z "$pos" ] || [ -z "$user" ]; then
    echo 'usage: mise run server:image:position -- <user> "x% y%"'; exit 1
  fi
  ssh "$PINZ_SERVER" "cd pinz && /usr/bin/mise exec -- node bin/pinz-admin.js image position $user '$pos'"
}
setpos'''

[tasks."server:backup"]
description = "Snapshot the server's data/ to ../devops/backups/pinz-data.<date>.tar.gz"
# tar is streamed over ssh — nothing is written on the server.
run = '''
DEST="{{config_root}}/../devops/backups"
test -d "$DEST" || { echo "missing $DEST"; exit 1; }
STAMP=$(date +%Y-%m-%d)
ssh "$PINZ_SERVER" "cd pinz && tar czf - data" > "$DEST/pinz-data.$STAMP.tar.gz"
echo "saved:"
ls -lh "$DEST"/pinz-data.*.tar.gz
'''

[tasks."server:admin"]
description = "Run the admin CLI on prod: mise run server:admin -- user list"
run = '''
admin() { ssh -t "$PINZ_SERVER" "cd pinz && /usr/bin/mise exec -- node bin/pinz-admin.js $*"; }
admin'''

[tasks."server:deploy"]
description = "Deploy to prod (push, hard-reset server checkout, npm ci, restart)"
run = "./server-setup/deploy.sh"

[tasks.features]
description = "Regenerate FEATURES.md from flow: comments (gen-features skill)"
run = "python3 ~/.claude/skills/gen-features/gen_features.py"

[tasks."ui:app"]
description = "Open the app"
run = "open http://localhost:$PORT"
