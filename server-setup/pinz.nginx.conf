# nginx vhost for pinz.charleslobo.com — everything proxies to the node app on
# loopback :7469; there is no static docroot (express serves its own assets).
# Install as written (port 80 only), then run
#   sudo certbot --nginx -d pinz.charleslobo.com
# which adds the TLS server block + the 80→443 redirect in place.

server {
    listen 80;
    server_name pinz.charleslobo.com;

    # A new tab minutes after the last one should reuse the connection instead of
    # paying TCP + TLS handshakes again (two round trips — half a second from far away).
    keepalive_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:7469;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
